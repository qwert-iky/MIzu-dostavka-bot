<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Маршрут поездки</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfeff',
              400: '#22d3ee',
              500: '#06b6d4',
              600: '#0891b2',
            },
            surface: {
              dark: '#0f172a',
              card: 'rgba(15, 23, 42, 0.92)',
              border: 'rgba(255, 255, 255, 0.1)',
            }
          }
        }
      }
    }
  </script>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <!-- Custom Styles with cache-buster -->
  <link rel="stylesheet" href="styles.css?v=5">
</head>
<body class="h-full bg-slate-950 text-slate-100 overflow-hidden font-sans select-none antialiased">
  <div id="app" class="relative h-full w-full flex flex-col">

    <!-- Top floating header bar -->
    <header class="absolute top-3 left-3 right-3 z-[1000] flex items-center justify-between pointer-events-none">
      <div class="pointer-events-auto bg-slate-900/85 backdrop-blur-md border border-white/10 rounded-full px-3 py-1.5 shadow-lg flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse"></span>
        <span id="badge-title" class="text-xs font-medium tracking-wide text-slate-200">Маршрут поездки</span>
        <span id="badge-points-count" class="text-[10px] bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 font-bold px-1.5 py-0.5 rounded-full hidden">2 точки</span>
      </div>

      <!-- Language Switcher & Controls -->
      <div class="pointer-events-auto flex items-center gap-2">
        <button id="btn-lang-toggle" class="bg-slate-900/85 backdrop-blur-md border border-white/10 rounded-full px-3 py-1.5 shadow-lg text-xs font-semibold hover:bg-slate-800 transition active:scale-95 flex items-center gap-1.5 text-cyan-400">
          <span id="lang-label">UZ</span>
        </button>
      </div>
    </header>

    <!-- Map Container -->
    <main id="map" class="h-full w-full z-0"></main>

    <!-- Floating Action Buttons on Map (Center Full Route) -->
    <div class="absolute bottom-64 right-4 z-[990] flex flex-col gap-2">
      <button id="btn-recenter" title="Показать весь маршрут" class="w-11 h-11 rounded-2xl bg-slate-900/90 backdrop-blur-md border border-white/15 text-slate-200 shadow-xl flex items-center justify-center hover:bg-slate-800 hover:text-cyan-400 active:scale-95 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
        </svg>
      </button>
    </div>

    <!-- Bottom Sheet / Multi-Route Info Card -->
    <section id="bottom-sheet" class="absolute bottom-0 inset-x-0 z-[1000] p-2.5 pb-safe">
      <div class="bg-slate-900/95 backdrop-blur-xl border border-white/10 rounded-3xl p-3.5 shadow-2xl transition-all duration-300 max-h-[70vh] flex flex-col">
        
        <!-- Sheet Handle -->
        <div class="w-10 h-1 bg-white/20 rounded-full mx-auto mb-2 shrink-0"></div>

        <!-- Loading Skeleton -->
        <div id="route-loading" class="space-y-3 py-2">
          <div class="flex items-center justify-between">
            <div class="h-4 bg-slate-800 rounded w-1/3 animate-pulse"></div>
            <div class="h-4 bg-slate-800 rounded w-1/4 animate-pulse"></div>
          </div>
          <div class="h-8 bg-slate-800 rounded-xl w-3/4 animate-pulse"></div>
          <div class="grid grid-cols-3 gap-2 pt-2">
            <div class="h-10 bg-slate-800 rounded-xl animate-pulse"></div>
            <div class="h-10 bg-slate-800 rounded-xl animate-pulse"></div>
            <div class="h-10 bg-slate-800 rounded-xl animate-pulse"></div>
          </div>
        </div>

        <!-- Error State -->
        <div id="route-error" class="hidden py-4 text-center space-y-2">
          <div class="w-10 h-10 mx-auto rounded-full bg-rose-500/10 border border-rose-500/20 flex items-center justify-center text-rose-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
          </div>
          <p id="error-message" class="text-sm text-slate-300 font-medium">Не удалось построить маршрут</p>
          <button id="btn-retry" class="px-4 py-1.5 text-xs font-semibold rounded-xl bg-cyan-500 text-slate-950 hover:bg-cyan-400 active:scale-95 transition">
            Повторить
          </button>
        </div>

        <!-- Route Content -->
        <div id="route-content" class="hidden space-y-2.5 overflow-hidden flex flex-col">
          
          <!-- Distance & Duration Highlights -->
          <div class="flex items-center justify-between border-b border-white/5 pb-2 shrink-0">
            <div>
              <span id="lbl-trip-time" class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold block">Общее время</span>
              <span id="route-duration" class="text-xl font-bold tracking-tight text-white flex items-baseline gap-1">
                -- <span class="text-xs font-normal text-slate-400">мин</span>
              </span>
            </div>
            <div class="text-right">
              <span id="lbl-distance" class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold block">Вся дистанция</span>
              <span id="route-distance" class="text-xl font-bold tracking-tight text-cyan-400 flex items-baseline justify-end gap-1">
                -- <span class="text-xs font-normal text-slate-400">км</span>
              </span>
            </div>
          </div>

          <!-- Waypoints / Route Legs Scrollable List -->
          <div class="overflow-y-auto max-h-36 pr-1 space-y-1.5 custom-scroll shrink-0">
            <div class="flex items-center justify-between text-[11px] text-slate-400 px-0.5">
              <span id="lbl-legs-title" class="font-medium">Отрезки маршрута:</span>
              <span id="lbl-legs-hint" class="text-[10px] text-slate-500">нажмите для фокуса</span>
            </div>
            <div id="legs-container" class="space-y-1">
              <!-- Dynamically populated via JS -->
            </div>
          </div>

          <!-- Open in External Navigators -->
          <div class="shrink-0 pt-1 border-t border-white/5">
            <div class="flex items-center justify-between mb-1.5">
              <span id="lbl-navigators" class="text-[10px] font-medium text-slate-400">Поехать по навигатору (все точки):</span>
            </div>
            <div class="grid grid-cols-3 gap-2">
              <!-- Yandex Maps -->
              <button id="btn-nav-yandex" class="flex flex-col items-center justify-center py-2 px-1 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 border border-white/5 active:scale-95 transition text-center group">
                <span class="text-sm mb-0.5">🟡</span>
                <span class="text-[11px] font-semibold text-slate-200 group-hover:text-amber-400 transition">Яндекс</span>
              </button>
              
              <!-- 2GIS -->
              <button id="btn-nav-2gis" class="flex flex-col items-center justify-center py-2 px-1 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 border border-white/5 active:scale-95 transition text-center group">
                <span class="text-sm mb-0.5">🟢</span>
                <span class="text-[11px] font-semibold text-slate-200 group-hover:text-emerald-400 transition">2GIS</span>
              </button>

              <!-- Google Maps -->
              <button id="btn-nav-google" class="flex flex-col items-center justify-center py-2 px-1 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 border border-white/5 active:scale-95 transition text-center group">
                <span class="text-sm mb-0.5">🔵</span>
                <span class="text-[11px] font-semibold text-slate-200 group-hover:text-cyan-400 transition">Google</span>
              </button>
            </div>
          </div>

        </div>

      </div>
    </section>

  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Application Logic with cache-buster -->
  <script src="app.js?v=5"></script>
</body>
</html>
